id-template-rows .65s cubic-bezier(.22,1,.36,1),opacity .5s}.optimization.visible{grid-template-rows:1fr;opacity:1}.optimization>.clip>.group{padding-top:11px}.text-change{animation:textIn .35s ease both}.controls{width:258px}.eyebrow{font-size:11px;letter-spacing:2px;color:#969ba6;margin-bottom:14px}.controls h2{font-size:27px;line-height:1.4;margin:0 0 12px;font-weight:600}.controls p{font-size:13px;color:#858b97;line-height:1.8;margin:0 0 28px}.phase{font-size:13px;color:#525c70;margin-bottom:14px;display:flex;align-items:center;gap:8px}.dot{width:6px;height:6px;background:#397bff;border-radius:50%}.track{height:3px;background:#e0e3eb;border-radius:5px;overflow:hidden;margin-bottom:24px}.progress{height:100%;background:#397bff;width:0}.buttons{display:flex;gap:8px}.buttons button{padding:9px 16px;background:#fff;border:1px solid #e1e4eb;border-radius:8px;font-size:13px;color:#454e60}.buttons button:first-child{background:#171b24;color:white;border-color:#171b24}.options{display:flex;gap:12px;margin-top:18px;font-size:12px;color:#858b97;align-items:center}.options label{display:flex;align-items:center;gap:4px}input{accent-color:#397bff}.options select{font:inherit;color:inherit;background:transparent;border:0} @keyframes glow-bed-flow{from{transform:translate3d(-3px,0,0) scale(.99)}to{transform:translate3d(3px,3px,0) scale(1.015)}}@keyframes glow-purple-flow{from{transform:translate3d(4px,-2px,0) scale(.98);opacity:.6}to{transform:translate3d(-5px,4px,0) scale(1.04);opacity:.78}}@keyframes glow-blue-flow{from{transform:translate3d(-5px,3px,0) scale(1.02);opacity:.78}to{transform:translate3d(5px,-3px,0) scale(.96);opacity:.62}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes star-turn{0%{transform:rotate(0deg);animation-timing-function:cubic-bezier(.22,1,.36,1)}12.5%{transform:rotate(90deg)}25%{transform:rotate(90deg);animation-timing-function:cubic-bezier(.22,1,.36,1)}37.5%{transform:rotate(180deg)}50%{transform:rotate(180deg);animation-timing-function:cubic-bezier(.22,1,.36,1)}62.5%{transform:rotate(270deg)}75%{transform:rotate(270deg);animation-timing-function:cubic-bezier(.22,1,.36,1)}87.5%,100%{transform:rotate(360deg)}}@keyframes breathe{to{opacity:.65;transform:translateY(8px) scale(1.06)}}@keyframes rowIn{from{opacity:0;transform:translateY(5px)}}@keyframes textIn{from{opacity:.3;transform:translateY(4px)}}@media(max-width:720px){main{padding:0;display:block}.device{margin:auto;max-width:100%;border-radius:0;box-shadow:none}.controls{width:100%;max-width:375px;margin:24px auto;padding:0 24px 30px}.controls h2,.controls p,.eyebrow{display:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style></head><body><main><section class="device" aria-label="智能诊断优化预览"><div class="glow"></div><div class="status"><span>9:41</span><span class="signals"><svg width="20" height="14" viewBox="0 0 20 14" fill="currentColor"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" width="3" height="14" rx="1"/></svg><svg width="18" height="14" viewBox="0 0 20 16"><path d="M2 5 Q10 -1 18 5 M5 9 Q10 5 15 9" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M7 12 L10 15 L13 12 Q10 9 7 12" fill="currentColor"/></svg><svg width="26" height="14" viewBox="0 0 28 15"><rect x=".5" y="1" width="24" height="13" rx="3.5" fill="none" stroke="#999"/><rect x="2" y="2.5" width="21" height="10" rx="2" fill="#28292c"/><path d="M26 5v5" stroke="#999" stroke-width="1.5"/></svg></span></div><div class="nav"><button class="back" aria-label="返回"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.293 4.293a1 1 0 0 1 1.414 1.414L9.414 12l6.293 6.293a1 1 0 0 1-1.414 1.414l-7-7a1 1 0 0 1 0-1.414l7-7Z" fill="#000103" fill-opacity=".95"/></svg></button><span class="nav-title">确认装修效果</span></div><div class="hero"><div class="symbol"><svg class="spark" viewBox="0 0 30 29" fill="currentColor"><path d="M11 5c1 0 1.4 4.8 3.7 7.1S22 15 22 16s-5 1.6-7.3 3.9S12 27 11 27s-1.4-4.8-3.7-7.1S0 17 0 16s5-1.6 7.3-3.9S10 5 11 5Z"/><path d="M23 1c.7 0 1 2.7 2.2 3.9S29 6.3 29 7s-2.6.9-3.8 2.1S23.7 13 23 13s-1-2.7-2.2-3.9S17 7.7 17 7s2.6-.9 3.8-2.1S22.3 1 23 1Z"/></svg><svg class="success" viewBox="0 0 30 29"><circle cx="15" cy="13" r="10" fill="#0bb537"/><path d="m11 13 3 3 5-5" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h1 id="title">智能诊断中...</h1><p class="subtitle" id="subtitle"></p></div><div class="divider"></div><div class="groups"><div class="group" id="diagnosis"><button class="group-head" aria-expanded="true"><span class="icon const $=s=>document.querySelector(s);const check='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.5"/><path d="m5.3 8 1.9 2.1 3.5-4.3" stroke-linecap="round" stroke-linejoin="round"/></svg>',warn='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.5v4" stroke-linecap="round"/><circle cx="8" cy="11.3" r=".7" fill="currentColor" stroke="none"/></svg>',loading='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14.4 8A6.4 6.4 0 1 1 8 1.6" stroke-linecap="round"/></svg>';
function icon(el,kind){el.classList.toggle('spin',kind==='loading');el.innerHTML=kind==='loading'?loading:kind==='warning'?warn:check}function row(text,kind){return `<div class="row"><span class="icon ${kind==='loading'?'spin':''}">${kind==='loading'?loading:kind==='warning'?warn:check}</span><span>${text}</span></div>`}function text(el,value){if(el.innerHTML!==value)el.innerHTML=value}
function updateRows(el,html){const template=document.createElement('template');template.innerHTML=html;const count=template.content.children.length;Array.from(template.content.children).forEach((next,i)=>{const current=el.children[i];if(!current){next.classList.add('enter');el.append(next)}else if(current.innerHTML!==next.innerHTML){next.classList.add('enter');current.replaceWith(next)}});while(el.children.length>count)el.lastElementChild.remove()}
const frames=[{at:0,count:1},{at:1300,count:2},{at:2600,count:3},{at:4600,count:4},{at:6800,stage:1},{at:7700,stage:2,count:0},{at:9200,stage:2,count:1},{at:10800,stage:2,count:2},{at:12300,stage:3}];let elapsed=0,paused=false,last=0,frame=-1;const duration=15000;
function render(i){const f=frames[i],stage=f.stage||0,c=f.count||0;const completed=stage===1||stage===3;const star=$('.spark');if(completed&&!$('.device').classList.contains('complete')){const rotation=getComputedStyle(star).transform;star.getAnimations().forEach(a=>a.cancel());star.animate([{transform:rotation},{transform:rotation+' rotate(90deg)'}],{duration:340,easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'})}else if(!completed&&$('.device').classList.contains('complete')){star.getAnimations().forEach(a=>a.cancel());star.style.animation='none';void star.offsetWidth;star.style.animation=''}$('.device').classList.toggle('complete',completed);$('#diagnosis').classList.toggle('collapsed',stage>=2);$('#diagnosis .group-head').setAttribute('aria-expanded',stage<2);$('#optimization').classList.toggle('visible',stage>=2);text($('#title'),stage===3?'智能诊断完成':stage===2?'智能优化中...':stage===1?'智能诊断完成':'智能诊断中...');text($('#subtitle'),stage>=2?(stage===3?'已完成<span class="blue">2</span>项自动优化，1项待手动补充':`正在帮你优化门店素材，已完成<span class="blue">${c}/3</span>项`):`已看完<span class="blue">${c||4}/4</span>项，现在帮你检查相册，马上就好`);icon($('#diagnosisIcon'),stage?'done':'loading');text($('#diagnosisLabel'),stage?'检查完成·已完成4/4项':`检查中·已完成${c}/4项`);const d=[row('外显小图内容清晰，无需优化','done'),row('门店头图信息可优化','warning')];if(stage||c>=4)d.push(row('相册图片主体清晰度可优化','warning'));else d.push(row(c>=3?'检查相册主体是否清晰 3/4....':c===2?'正在检查门店头图信息 2/4....':'正在检查外显小图内容 1/4....','loading'));if(stage||c>=4)d.push(row('推荐菜信息待手动补充','warning'));updateRows($('#diagnosisRows'),d.slice(0,stage||c>=3?d.length:c).join(''));icon($('#optimizationIcon'),stage===3?'done':'loading');text($('#optimizationLabel'),stage===3?'优化完成·2项自动优化，1项待手动补充':`优化中·已完成${c}/3项`);const opt=[];if(c>=1||stage===3)opt.push(row('门店头图已自动优化','done'));if(c>=2||stage===3)opt.push(row('相册图片已自动优化','done'));if(stage===3)opt.push(row('推荐菜信息待手动补充','warning'));else opt.push(row(c===0?'正在优化门店头图信息...':c===1?'正在优化相册图片清晰度...':'正在检查推荐菜信息...','loading'));updateRows($('#optimizationRows'),opt.join(''));}
function tick(now){if(last&&!paused)elapsed+=Math.min(now-last,100)*1;last=now;let i=frames.findLastIndex(f=>elapsed>=f.at);if(i!==frame){frame=i;render(i)}requestAnimationFrame(tick)}function restart(){elapsed=0;frame=-1;paused=false}$('.back').onclick=()=>history.length>1?history.back():restart();document.querySelectorAll('.group-head').forEach(b=>b.onclick=()=>{const group=b.closest('.group');group.classList.toggle('collapsed');b.setAttribute('aria-expanded',!group.classList.contains('collapsed'))});requestAnimationFrame(tick);
</script></body></html>
