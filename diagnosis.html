const $=s=>document.querySelector(s);const check='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.5"/><path d="m5.3 8 1.9 2.1 3.5-4.3" stroke-linecap="round" stroke-linejoin="round"/></svg>',warn='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.5v4" stroke-linecap="round"/><circle cx="8" cy="11.3" r=".7" fill="currentColor" stroke="none"/></svg>',loading='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14.4 8A6.4 6.4 0 1 1 8 1.6" stroke-linecap="round"/></svg>';
function icon(el,kind){el.classList.toggle('spin',kind==='loading');el.innerHTML=kind==='loading'?loading:kind==='warning'?warn:check}function row(text,kind){return `<div class="row"><span class="icon ${kind==='loading'?'spin':''}">${kind==='loading'?loading:kind==='warning'?warn:check}</span><span>${text}</span></div>`}function text(el,value){if(el.innerHTML!==value)el.innerHTML=value}
function updateRows(el,html){const template=document.createElement('template');template.innerHTML=html;const count=template.content.children.length;Array.from(template.content.children).forEach((next,i)=>{const current=el.children[i];if(!current){next.classList.add('enter');el.append(next)}else if(current.innerHTML!==next.innerHTML){next.classList.add('enter');current.replaceWith(next)}});while(el.children.length>count)el.lastElementChild.remove()}
const frames=[{at:0,count:1},{at:1300,count:2},{at:2600,count:3},{at:4600,count:4},{at:6800,stage:1},{at:7700,stage:2,count:0},{at:9200,stage:2,count:1},{at:10800,stage:2,count:2},{at:12300,stage:3}];let elapsed=0,paused=false,last=0,frame=-1;const duration=15000;
function render(i){const f=frames[i],stage=f.stage||0,c=f.count||0;const completed=stage===1||stage===3;const success=$('.success');success.style.setProperty('visibility',completed?'visible':'hidden','important');success.style.setProperty('opacity',completed?'1':'0','important');const star=$('.spark');if(completed&&!$('.device').classList.contains('complete')){const rotation=getComputedStyle(star).transform;star.getAnimations().forEach(a=>a.cancel());star.animate([{transform:rotation},{transform:rotation+' rotate(90deg)'}],{duration:340,easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'})}else if(!completed&&$('.device').classList.contains('complete')){star.getAnimations().forEach(a=>a.cancel());star.style.animation='none';void star.offsetWidth;star.style.animation=''}$('.device').classList.toggle('complete',completed);$('.symbol').classList.toggle('is-complete',completed);$('#diagnosis').classList.toggle('collapsed',stage>=2);$('#diagnosis .group-head').setAttribute('aria-expanded',stage<2);$('#optimization').classList.toggle('visible',stage>=2);text($('#title'),stage===3?'智能诊断完成':stage===2?'智能优化中...':stage===1?'智能诊断完成':'智能诊断中...');text($('#subtitle'),stage>=2?(stage===3?'已完成<span class="blue">2</span>项自动优化，1项待手动补充':`正在帮你优化门店素材，已完成<span class="blue">${c}/3</span>项`):`已看完<span class="blue">${c||4}/4</span>项，现在帮你检查相册，马上就好`);icon($('#diagnosisIcon'),stage?'done':'loading');text($('#diagnosisLabel'),stage?'检查完成·已完成4/4项':`检查中·已完成${c}/4项`);const d=[row('外显小图内容清晰，无需优化','done'),row('门店头图信息可优化','warning')];if(stage||c>=4)d.push(row('相册图片主体清晰度可优化','warning'));else d.push(row(c>=3?'检查相册主体是否清晰 3/4....':c===2?'正在检查门店头图信息 2/4....':'正在检查外显小图内容 1/4....','loading'));if(stage||c>=4)d.push(row('推荐菜信息待手动补充','warning'));updateRows($('#diagnosisRows'),d.slice(0,stage||c>=3?d.length:c).join(''));icon($('#optimizationIcon'),stage===3?'done':'loading');text($('#optimizationLabel'),stage===3?'优化完成·2项自动优化，1项待手动补充':`优化中·已完成${c}/3项`);const opt=[];if(c>=1||stage===3)opt.push(row('门店头图已自动优化','done' function tick(now){if(last&&!paused)elapsed+=Math.min(now-last,100)*1;last=now;let i=frames.findLastIndex(f=>elapsed>=f.at);if(i!==frame){frame=i;render(i)}requestAnimationFrame(tick)}function restart(){elapsed=0;frame=-1;paused=false}$('.back').onclick=()=>history.length>1?history.back():restart();document.querySelectorAll('.group-head').forEach(b=>b.onclick=()=>{const group=b.closest('.group');group.classList.toggle('collapsed');b.setAttribute('aria-expanded',!group.classList.contains('collapsed'))});$('.spark').addEventListener('animationstart',()=>$('.symbol').classList.add('is-spinning'),{once:true});requestAnimationFrame(tick);
